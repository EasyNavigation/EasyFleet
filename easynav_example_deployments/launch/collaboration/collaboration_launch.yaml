# "collaboration" deployment scenario: three robots working together.
#   - robot_1: perception, navigation
#   - robot_2: perception, navigation
#   - robot_3: navigation, manipulation
# Each robot is namespaced independently (see the per-robot launch files),
# so their capabilities never collide and can also be brought up on their
# own (e.g. `ros2 launch deployments robot_1_launch.yaml`).
launch:
  - include:
      file: "$(find-pkg-share deployments)/launch/collaboration/robot_1_launch.yaml"
  - include:
      file: "$(find-pkg-share deployments)/launch/collaboration/robot_2_launch.yaml"
  - include:
      file: "$(find-pkg-share deployments)/launch/collaboration/robot_3_launch.yaml"
