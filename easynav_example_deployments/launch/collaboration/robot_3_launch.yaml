# robot_3 in the "collaboration" scenario: equipped with navigation and
# manipulation, namespaced under /robot_3 so its actions and /capabilities
# identity never collide with robot_1 or robot_2. Can be run standalone.
launch:
  - group:
      - push_ros_namespace:
          namespace: "robot_3"

      - node:
          pkg: "navigation_capability"
          exec: "navigation_capability_node"
          name: "navigation"
          output: "screen"
          param:
            - from: "$(find-pkg-share deployments)/config/collaboration/robot_3/navigation_params.yaml"
            - name: "capabilities_file"
              value: "$(find-pkg-share deployments)/config/collaboration/robot_3/navigation.json"

      - node:
          pkg: "manipulation_capability"
          exec: "manipulation_capability_node"
          name: "manipulation"
          output: "screen"
          param:
            - from: "$(find-pkg-share deployments)/config/collaboration/robot_3/manipulation_params.yaml"
            - name: "capabilities_file"
              value: "$(find-pkg-share deployments)/config/collaboration/robot_3/manipulation.json"
