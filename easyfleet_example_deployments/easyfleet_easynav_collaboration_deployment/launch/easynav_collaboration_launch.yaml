# This deployment's top-level launch file: two real-EasyNav-navigating
# robots plus mission control.
#   - robot_1: navigation (real EasyNav), perception (mock)
#   - robot_2: navigation (real EasyNav), manipulation (mock)
# Each robot is namespaced independently (see the per-robot launch files),
# so their capabilities never collide and can also be brought up on their
# own (e.g. `ros2 launch easyfleet_easynav_collaboration_deployment robot_1_launch.yaml`).
#
# Does NOT launch Gazebo -- start
# `ros2 launch easynav_playground_kobuki playgorund_multirobot_kobuki.launch.py`
# separately first, so both robots are already spawned (namespaced
# "robot_1"/"robot_2", see multirobot_config.yaml) and publishing
# scan_raw/odom/TF before system_main tries to localize against them.
#
# easynav_collaboration_mission_node is delayed a few seconds so both
# robots have finished activating (and published their /capabilities
# announcements) before mission control's discovery window (see
# easyfleet_mission_manager::discover_capabilities()) opens -- launching
# everything at literally the same instant risks discovering nothing.
launch:
  - include:
      file: "$(find-pkg-share easyfleet_easynav_collaboration_deployment)/launch/robot_1_launch.yaml"
  - include:
      file: "$(find-pkg-share easyfleet_easynav_collaboration_deployment)/launch/robot_2_launch.yaml"

  - timer:
      period: 5.0
      children:
        - node:
            pkg: "easyfleet_easynav_collaboration_deployment"
            exec: "easynav_collaboration_mission_node"
            output: "screen"
            param:
              - name: "use_sim_time"
                value: true
