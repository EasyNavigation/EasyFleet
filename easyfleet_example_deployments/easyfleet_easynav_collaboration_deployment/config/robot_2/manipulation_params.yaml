# Parameters for the "manipulation" capability of robot_2 in this
# deployment. `capabilities_file` is computed in code (robot_node.cpp) via
# ament_index_cpp, not set here. Uses the "/**" wildcard (rather than a
# bare node name) since this file loads onto robot_node, namespaced under
# "robot_2" alongside (a separate process for) real EasyNav navigation.
/**:
  ros__parameters:
    manipulation:
      allow_preemption: true
      # Long enough (with a safety margin under Phase 3's own 10s
      # run_capability timeout in main_easynav_collaboration.cpp) for the
      # "Manipulating" status marker above robot_2 to actually be
      # noticeable -- at the mock's original 3.0s default, it and the
      # "Manipulation done" message that follows it were easy to miss
      # entirely mid-mission, since Phase 4 starts overwriting robot_2's
      # status again almost immediately afterwards.
      mock_execution_duration: 8.0
      mock_feedback_period: 0.3
