# "alone" deployment scenario: launches both halves of it --
#   - the robot (robot_1_launch.yaml): one process, robot_node, hosting all
#     three mock capabilities (navigation, manipulation, perception).
#   - mission control (alone_mission_node): discovers robot_1's active
#     capabilities and exercises them. Delayed a few seconds so robot_1 has
#     finished activating (and published its /capabilities announcements)
#     before mission control's discovery window (see
#     easyfleet_mission_manager::discover_capabilities()) opens -- launching
#     both at literally the same instant risks discovering nothing.
launch:
  - include:
      file: "$(find-pkg-share easyfleet_fake_alone_deployment)/launch/robot_1_launch.yaml"

  - timer:
      period: 3.0
      children:
        - node:
            pkg: "easyfleet_fake_alone_deployment"
            exec: "alone_mission_node"
            output: "screen"
