# robot_1 in the "alone" scenario: one process (robot_node) hosting all
# three capabilities (navigation, manipulation, perception), each its own
# lifecycle node, namespaced under /robot_1 so their actions and
# /capabilities identity never collide with any other robot that might
# later join this scenario. Can be run standalone.
#
# Deliberately no `name:` on this node: with several distinctly-named
# capability nodes living in one process, there is no single node name to
# remap to -- each capability already carries its own explicit name (set
# by its own constructor).
launch:
  - group:
      - push_ros_namespace:
          namespace: "robot_1"

      - node:
          pkg: "easyfleet_fake_alone_deployment"
          exec: "robot_node"
          output: "screen"
          param:
            - from: "$(find-pkg-share easyfleet_fake_alone_deployment)/config/robot_1/robot_params.yaml"
            - from: "$(find-pkg-share easyfleet_fake_alone_deployment)/config/robot_1/navigation_params.yaml"
            - from: "$(find-pkg-share easyfleet_fake_alone_deployment)/config/robot_1/manipulation_params.yaml"
            - from: "$(find-pkg-share easyfleet_fake_alone_deployment)/config/robot_1/perception_params.yaml"
