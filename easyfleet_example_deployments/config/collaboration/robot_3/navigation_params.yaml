# Parameters for the "navigation" capability of robot_3 in the
# "collaboration" deployment scenario. `capabilities_file` is supplied by
# launch/collaboration/robot_3_launch.yaml, not set here.
navigation:
  ros__parameters:
    navigation:
      allow_preemption: true
      mock_navigation_duration: 5.0
      mock_feedback_period: 0.5
      mock_initial_distance: 5.0
