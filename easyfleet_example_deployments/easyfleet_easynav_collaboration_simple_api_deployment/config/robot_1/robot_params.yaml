# Tells robot_node which fake capabilities robot_1 hosts (real navigation
# is a separate process, see launch/robot_1_launch.yaml), and which
# config/<config_subdir>/ its JSON capability descriptions live under. Read
# by robot_node's "robot_config" bootstrap node -- matched via the "/**"
# wildcard for the same reason as this directory's other params files (see
# perception_params.yaml).
/**:
  ros__parameters:
    capabilities: ["perception"]
    config_subdir: "robot_1"
