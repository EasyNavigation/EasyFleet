# robot_1 in the "alone" scenario: equipped with all three capabilities
# (navigation, manipulation, perception), each namespaced under /robot_1 so
# their actions and /capabilities identity never collide with any other
# robot that might later join this scenario. Can be run standalone.
launch:
  - group:
      - push_ros_namespace:
          namespace: "robot_1"

      - node:
          pkg: "easyfleet_example_deployments"
          exec: "navigation_fake_capability_node"
          name: "navigation"
          output: "screen"
          param:
            - from: "$(find-pkg-share easyfleet_example_deployments)/config/alone/robot_1/navigation_params.yaml"
            - name: "capabilities_file"
              value: "$(find-pkg-share easyfleet_example_deployments)/config/alone/robot_1/navigation.json"

      - node:
          pkg: "easyfleet_example_deployments"
          exec: "manipulation_fake_capability_node"
          name: "manipulation"
          output: "screen"
          param:
            - from: "$(find-pkg-share easyfleet_example_deployments)/config/alone/robot_1/manipulation_params.yaml"
            - name: "capabilities_file"
              value: "$(find-pkg-share easyfleet_example_deployments)/config/alone/robot_1/manipulation.json"

      - node:
          pkg: "easyfleet_example_deployments"
          exec: "perception_fake_capability_node"
          name: "perception"
          output: "screen"
          param:
            - from: "$(find-pkg-share easyfleet_example_deployments)/config/alone/robot_1/perception_params.yaml"
            - name: "capabilities_file"
              value: "$(find-pkg-share easyfleet_example_deployments)/config/alone/robot_1/perception.json"
