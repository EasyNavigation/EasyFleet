# robot_1 in the "collaboration" scenario: equipped with perception and
# navigation, namespaced under /robot_1 so its actions and /capabilities
# identity never collide with robot_2 or robot_3. Can be run standalone.
launch:
  - group:
      - push_ros_namespace:
          namespace: "robot_1"

      - node:
          pkg: "easyfleet_example_deployments"
          exec: "navigation_fake_capability_node"
          name: "navigation"
          output: "screen"
          param:
            - from: "$(find-pkg-share easyfleet_example_deployments)/config/collaboration/robot_1/navigation_params.yaml"
            - name: "capabilities_file"
              value: "$(find-pkg-share easyfleet_example_deployments)/config/collaboration/robot_1/navigation.json"

      - node:
          pkg: "easyfleet_example_deployments"
          exec: "perception_fake_capability_node"
          name: "perception"
          output: "screen"
          param:
            - from: "$(find-pkg-share easyfleet_example_deployments)/config/collaboration/robot_1/perception_params.yaml"
            - name: "capabilities_file"
              value: "$(find-pkg-share easyfleet_example_deployments)/config/collaboration/robot_1/perception.json"
