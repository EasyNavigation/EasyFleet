# "easynav" deployment scenario: a single robot, easynav_robot, whose
# navigation capability is backed by a real EasyNav stack (easynav_system
# system_main, configured here with its own Dummy* plugins) instead of the
# mock used by the "alone"/"collaboration" scenarios.
launch:
  - include:
      file: "$(find-pkg-share easyfleet_example_deployments)/launch/easynav/easynav_robot_launch.yaml"
