# Real-navigation variant of the "easynav" deployment scenario: real
# EasyNav (costmap localizer/maps-manager/planner + regulated pure-pursuit
# controller) instead of the Dummy* plugins used by easynav_launch.yaml --
# for testing against a real robot or Gazebo simulation of one (started
# separately). See launch/easynav/easynav_robot_gazebo_launch.yaml.
launch:
  - include:
      file: "$(find-pkg-share easyfleet_example_deployments)/launch/easynav/easynav_robot_gazebo_launch.yaml"
