# easynav_robot in the "easynav" scenario: a real EasyNav stack
# (easynav_system system_main, configured here with its own Dummy* plugins --
# see config/easynav/easynav_robot/easynav_system.dummy.params.yaml) plus the
# real EasyNav-backed navigation capability, namespaced under /easynav_robot.
# Can be run standalone.
launch:
  - group:
      - push_ros_namespace:
          namespace: "easynav_robot"

      - node:
          pkg: "easynav_system"
          exec: "system_main"
          output: "screen"
          param:
            - from: "$(find-pkg-share easyfleet_example_deployments)/config/easynav/easynav_robot/easynav_system.dummy.params.yaml"

      - node:
          pkg: "easyfleet_easynav_navigation"
          exec: "easynav_navigation_capability_node"
          name: "navigation"
          output: "screen"
          param:
            - from: "$(find-pkg-share easyfleet_example_deployments)/config/easynav/easynav_robot/navigation_params.yaml"
            - name: "behavior_tree_xml"
              value: "$(find-pkg-share easyfleet_easynav_navigation)/behavior_trees/navigate.xml"
            - name: "capabilities_file"
              value: "$(find-pkg-share easyfleet_example_deployments)/config/easynav/easynav_robot/navigation.json"
