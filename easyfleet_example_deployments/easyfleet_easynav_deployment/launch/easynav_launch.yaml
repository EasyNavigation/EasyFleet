# "easynav" deployment scenario: launches both the robot
# (easynav_robot_launch.yaml -- easynav_system system_main, configured
# here with its own Dummy* plugins instead of the mock used by the
# "alone"/"collaboration" scenarios, plus the navigation capability) and
# mission control (easynav_mission_node).
#
# easynav_mission_node is delayed a few seconds so the robot has finished
# activating (and published its /capabilities announcement) before mission
# control's discovery window (see
# easyfleet_mission_manager::discover_capabilities()) opens -- launching
# both at literally the same instant risks discovering nothing.
launch:
  - include:
      file: "$(find-pkg-share easyfleet_easynav_deployment)/launch/easynav_robot_launch.yaml"

  - timer:
      period: 3.0
      children:
        - node:
            pkg: "easyfleet_easynav_deployment"
            exec: "easynav_mission_node"
            output: "screen"
