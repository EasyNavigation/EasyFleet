# Real EasyNav (easynav_system system_main), no Dummy* plugins: costmap
# localizer/maps-manager/planner + the regulated pure-pursuit controller,
# copied verbatim from
# src/easynav_indoor_testcase/robots_params/costmap.rpp.params.yaml.
# For use with a real robot or Gazebo simulation of one -- see
# launch/easynav_robot_gazebo_launch.yaml, which loads this file
# instead of easynav_system.dummy.params.yaml (per the design intent from
# the start: swapping to a real navigation stack is just pointing at a
# different EasyNav params file, no code change on the EasyFleet side).
#
# Deliberately kept UNNAMESPACED (bare "<node_name>:" keys, unlike
# easynav_system.dummy.params.yaml's "/**/<node_name>" pattern), mirroring
# easynav_costmap_rpp.launch.py exactly: easynav_robot_gazebo_launch.yaml
# does not push a ROS namespace for system_main, because sensors_node's
# "scan_raw" topic and the localizer/controller's TF frames need to match
# Gazebo's own (unnamespaced) topics/frames. easynav_navigation_capability_node
# is launched unnamespaced alongside it for the same reason: its
# GoalManagerClient talks to system_node over the relative
# "easynav_control" topic, which must resolve to the same node as
# system_main's own GoalManager.
controller_node:
  ros__parameters:
    use_sim_time: true
    colision_checker:
      active: true
      debug_markers: true
      downsample_leaf_size: 0.05
      robot_radius: 0.30
      brake_acc: 1.0
      safety_margin: 0.05
    controller_types: [rpp]
    rpp:
      rt_freq: 30.0
      plugin: easynav_regulated_pp_controller/RegulatedPurePursuitController
      # Velocity / acceleration limits (TurtleBot 2 / Kobuki base)
      max_linear_vel: 0.6
      min_linear_vel: -0.3
      max_angular_vel: 1.2
      min_angular_vel: -1.2
      max_linear_accel: 1.0
      max_linear_decel: 1.0
      max_angular_accel: 2.0
      max_angular_decel: 2.0
      use_dynamic_window: false
      allow_reversing: false
      # Lookahead
      lookahead_dist: 0.5
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.2
      use_velocity_scaled_lookahead_dist: true
      # Rotate to heading
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 1.0
      rotate_to_heading_min_angle: 0.785
      # Curvature regulation
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.15
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 1.0
      interpolate_curvature_after_goal: false
      # Obstacle-proximity regulation (EasyNav's point-cloud based equivalent of Nav2's cost-based term)
      use_obstacle_regulated_linear_velocity_scaling: true
      obstacle_scaling_dist: 0.4
      obstacle_scaling_gain: 0.8
      # Approach to goal
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      # Goal tolerances (matching the serest config: 0.1 m / 6 deg)
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.105

localizer_node:
  ros__parameters:
    use_sim_time: true
    localizer_types: [costmap]
    costmap:
      rt_freq: 50.0
      freq: 5.0
      reseed_freq: 1.0
      plugin: easynav_costmap_localizer/AMCLLocalizer
      num_particles: 100
      noise_translation: 0.05
      noise_rotation: 0.1
      noise_translation_to_rotation: 0.1
      initial_pose:
        x: 0.0
        y: 0.1
        yaw: 0.0
        std_dev_xy: 0.1
        std_dev_yaw: 0.01

maps_manager_node:
  ros__parameters:
    use_sim_time: true
    map_types: [costmap]
    costmap:
      freq: 10.0
      plugin: easynav_costmap_maps_manager/CostmapMapsManager
      package: easynav_indoor_testcase
      map_path_file: maps/home2.yaml
      filters: [obstacles, inflation]
      obstacles:
        plugin: easynav_costmap_maps_manager/CostmapMapsManager/ObstaclesFilter
      inflation:
        plugin: easynav_costmap_maps_manager/CostmapMapsManager/InflationFilter
        inflation_radius: 1.3
        inscribed_radius: 0.25
        cost_scaling_factor: 3.0

planner_node:
  ros__parameters:
    use_sim_time: true
    planner_types: [simple]
    simple:
      freq: 0.5
      plugin: easynav_costmap_planner/CostmapPlanner
      cost_factor: 10.0
      continuous_replan: true

sensors_node:
  ros__parameters:
    use_sim_time: true
    forget_time: 0.5
    sensors: [laser1]
    laser1:
      topic: scan_raw
      type: sensor_msgs/msg/LaserScan

system_node:
  ros__parameters:
    use_sim_time: true
    use_real_time: true
    position_tolerance: 0.3
    angle_tolerance: 0.15
