# Parameters for the "navigation" capability of easynav_robot, shared by
# both the "easynav" scenario's Dummy-plugin launch
# (easynav_robot_launch.yaml) and its real EasyNav/Gazebo launch
# (easynav_robot_gazebo_launch.yaml) -- see
# easynav_navigation_capability_node. `capabilities_file` and
# `behavior_tree_xml` are supplied by those launch files, not set here
# (they need find-pkg-share substitution, which only launch files can
# resolve).
#
# Waypoints match src/easynav_indoor_testcase's "home2" map/world (see
# easynav_system.costmap_rpp.params.yaml's map_path_file), so they are
# valid, reachable targets for the real-EasyNav/Gazebo launch, not just
# placeholders for the Dummy-plugin one.
#
# Uses the "/**" wildcard (rather than a bare "navigation:" node name) so
# this file matches this node regardless of whether it ends up namespaced
# (easynav_robot_launch.yaml pushes it under "easynav_robot") or not
# (easynav_robot_gazebo_launch.yaml, matching
# easynav_costmap_rpp.launch.py's convention, uses no namespace) -- a bare
# node name only matches a node's *unqualified* name and does not account
# for a namespace push, which silently drops every parameter this file
# sets (arrays most noticeably, since their code-side default is an empty
# vector).
/**:
  ros__parameters:
    navigation:
      allow_preemption: true
      tick_rate_hz: 10.0
      waypoint_ids: ["dock", "kitchen", "charging_station"]
      waypoints:
        dock:
          frame_id: "map"
          x: 0.0
          y: 2.5
          yaw: 1.57
        kitchen:
          frame_id: "map"
          x: 5.4
          y: -3.0
          yaw: 0.0
        charging_station:
          frame_id: "map"
          x: -7.86
          y: -0.15
          yaw: -3.14
