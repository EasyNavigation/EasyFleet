# EasyNav, configured with its own Dummy* plugins on every subsystem (no real
# robot, no real sensors) -- this is real EasyNav (easynav_system system_main),
# not a mock: copied from src/easynav_indoor_testcase/robots_params/dummy.params.yaml
# ("Test1" in that package's own test matrix). Swapping to a real navigation
# stack later is just pointing at a different EasyNav params file (e.g. that
# same package's costmap.rpp.params.yaml) -- no code change on the EasyFleet
# side.
#
# Known characteristic: since DummyLocalizer never publishes robot_pose,
# GoalManager accepts goals but never completes them on its own -- easynav's
# navigation capability here relies on cancellation (same "runs until
# canceled" pattern as this package's perception_fake_capability).
#
# Uses "/**/<node_name>" (rather than a bare "<node_name>:" key, as the
# upstream reference file does) so every sub-node's parameters still load
# once easynav_robot_launch.yaml pushes system_main under the
# "easynav_robot" namespace -- a bare node name only matches that node's
# *unqualified* name and silently drops every parameter under it once
# namespaced (see navigation_params.yaml's own comment for how this exact
# class of bug was first found: EasyNav still configures/activates cleanly
# with everything silently unset, since these sub-nodes tolerate missing
# parameters, so it isn't obvious from the logs alone).
/**/controller_node:
  ros__parameters:
    use_sim_time: true
    controller_types: [dummy]
    dummy:
      rt_freq: 30.0
      plugin: easynav_controller/DummyController
      cycle_time_nort: 0.01
      cycle_time_rt: 0.001

/**/localizer_node:
  ros__parameters:
    use_sim_time: true
    localizer_types: [dummy]
    dummy:
      rt_freq: 50.0
      freq: 5.0
      reseed_freq: 0.1
      plugin: easynav_localizer/DummyLocalizer
      cycle_time_nort: 0.01
      cycle_time_rt: 0.001

/**/maps_manager_node:
  ros__parameters:
    use_sim_time: true
    map_types: [dummy]
    dummy:
      freq: 10.0
      plugin: easynav_maps_manager/DummyMapsManager
      cycle_time_nort: 0.1
      cycle_time_rt: 0.001

/**/planner_node:
  ros__parameters:
    use_sim_time: true
    planner_types: [dummy]
    dummy:
      freq: 1.0
      plugin: easynav_planner/DummyPlanner
      cycle_time_nort: 0.2
      cycle_time_rt: 0.001

/**/sensors_node:
  ros__parameters:
    use_sim_time: true
    forget_time: 0.5

/**/system_node:
  ros__parameters:
    use_sim_time: true
    position_tolerance: 0.1
    angle_tolerance: 0.05
