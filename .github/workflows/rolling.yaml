name: rolling

on:
  pull_request:
    branches:
      - rolling
  push:
    branches:
      - rolling
  schedule:
      - cron: '0 0 * * 6'
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/ros-tooling/setup-ros-docker/setup-ros-docker-ubuntu-resolute-ros-rolling-ros-base:master
    steps:
      - uses: actions/checkout@v6
      # The image can lag behind the published packages, and mixing them breaks the ABI.
      - name: Upgrade the image's packages
        run: apt-get update && apt-get -y dist-upgrade
      - name: build and test
        uses: ros-tooling/action-ros-ci@0.4.8
        with:
          package-name: >-
            easyfleet_interfaces
            easyfleet_core
            easyfleet_mission_manager
            easyfleet_mission_manager_py
            easyfleet_navigation_manager
            easyfleet_easynav_navigation
            easyfleet_bt_nodes
            easyfleet_tools
          target-ros2-distro: rolling
          vcs-repo-file-url: ${GITHUB_WORKSPACE}/.github/thirdparty_rolling.repos
          colcon-defaults: |
            {
              "build": {
                "packages-up-to": true,
                "mixin": ["coverage-gcc"]
              },
              "test": {
                "parallel-workers": 1
              }
            }
          colcon-mixin-repository: https://raw.githubusercontent.com/colcon/colcon-mixin-repository/b8436aa16c0bdbc01081b12caa253cbf16e0fb82/index.yaml
      - name: Codecov
        uses: codecov/codecov-action@v5.5.3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ros_ws/lcov/total_coverage.info
          flags: unittests
          slug: EasyNavigation/EasyFleet
          name: codecov-umbrella
          fail_ci_if_error: false
